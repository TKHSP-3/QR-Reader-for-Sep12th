<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>説明会 出席確認QRリーダー</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
<style>
body{
    font-family:"Yu Gothic",sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

#reader{
    width:500px;
    max-width:100%;
    margin:20px auto;
}

#status{
    font-size:24px;
    font-weight:bold;
    color:#0066cc;
}
</style>

</head>
<body>

<div class="container">

<h1>説明会 出席確認</h1>

<p>
QRコードをカメラにかざしてください
</p>

<div id="reader"></div>

<div id="status">
カメラ起動中...
</div>

</div>

<script>

let scanned = false;

const statusArea =
document.getElementById("status");

function onScanSuccess(decodedText){

    if(scanned) return;

    scanned = true;

    try{

        const url = new URL(decodedText);

       const popup = window.open(url.href, "attendance");

setTimeout(() => {
    try {
        popup.close();
    } catch(e) {
        console.log(e);
    }
}, 5000);

        let sec = 5;

        statusArea.innerText =
        "✅ 受付完了　次の受付まで " +
        sec +
        " 秒";

        const timer = setInterval(() => {

            sec--;

            statusArea.innerText =
            "✅ 受付完了　次の受付まで " +
            sec +
            " 秒";

            if(sec <= 0){

                clearInterval(timer);

                scanned = false;

                statusArea.innerText =
                "QRコードをかざしてください";
            }

        },1000);

    }catch(e){

        statusArea.innerText =
        "URLではないQRコードです";

        scanned = false;
    }
}

const html5QrCode =
new Html5Qrcode("reader");

Html5Qrcode.getCameras()
.then(cameras => {

    if(cameras.length > 0){

        statusArea.innerText =
        "QRコードをかざしてください";

        html5QrCode.start(
            cameras[0].id,
            {
                fps:10,
                qrbox:250
            },
            onScanSuccess
        );

    }else{

        statusArea.innerText =
        "カメラが見つかりません";
    }

})
.catch(err => {

    statusArea.innerText =
    "カメラ起動エラー";

    console.error(err);

});

</script>

</body>
</html>
