<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>説明会 出席確認QRリーダー</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></scriptnt-family: "Yu Gothic", sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    color:#333;
}

#reader{
    width:500px;
    max-width:100%;
    margin:20px auto;
    border:1px solid #ddd;
    background:white;
    border-radius:10px;
    padding:10px;
}

#status{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:#0066cc;
}

.success{
    color:green;
}

.error{
    color:red;
}
</style>
</head>

<body>

<div class="container">

<h1>説明会 出席確認</h1>

<p>
QRコードをカメラにかざしてください。<br>
読み取り後、自動で受付ページへ移動します。
</p>

<div id="reader"></div>

<div id="status">
カメラを起動しています...
</div>

</div>

<script>

let scanned = false;

const statusArea = document.getElementById("status");

function onScanSuccess(decodedText) {

    if (scanned) return;

    scanned = true;

    try {

        const url = new URL(decodedText);

        statusArea.className = "success";
        statusArea.innerText =
            "QRコードを認識しました。移動します...";

        setTimeout(() => {
            window.location.href = url.href;
        }, 500);

    } catch (e) {

        statusArea.className = "error";
        statusArea.innerText =
            "URLではないQRコードです";

        scanned = false;
    }
}

function onScanFailure(error) {
    // エラー表示不要
}

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras()
.then(cameras => {

    if (cameras.length === 0) {

        statusArea.className = "error";
        statusArea.innerText =
            "カメラが見つかりません";

        return;
    }

    statusArea.innerText =
        "QRコードを読み取ってください";

    html5QrCode.start(
        cameras[0].id,
        {
            fps: 10,
            qrbox: 250
        },
        onScanSuccess,
        onScanFailure
    );
})
.catch(err => {

    statusArea.className = "error";
    statusArea.innerText =
        "カメラの起動に失敗しました";

    console.error(err);
});

</script>

</body>
</html>
